<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechWise 360 | Set New Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body data-page="reset-password">
  <main class="auth-shell compact-auth-shell">
    <section class="form-card login-card recovery-card" aria-labelledby="reset-title">
      <a class="auth-brand-header" href="index.html" style="justify-content: center; margin-bottom: 20px;">
        <span class="auth-logo-mark" aria-hidden="true">
          <svg class="techwise-cube-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" focusable="false">
            <path d="M20.5 7.25 12 12.1 3.5 7.25"></path>
            <path d="M12 12.1V21.5"></path>
            <path d="M21 16.55V7.45a2 2 0 0 0-1-1.73l-6-3.42a4 4 0 0 0-4 0L4 5.72a2 2 0 0 0-1 1.73v9.1a2 2 0 0 0 1 1.73l6 3.42a4 4 0 0 0 4 0l6-3.42a2 2 0 0 0 1-1.73Z"></path>
          </svg>
        </span>
        <div class="auth-brand-text">
          <strong>TechWise <span>360</span></strong>
          <small>Learn. Practice. Grow.</small>
        </div>
      </a>

      <div class="form-heading" style="text-align: center;">
        <span class="auth-card-pill"><i data-lucide="shield-check"></i> Security</span>
        <h1 id="reset-title" style="font-size: 24px; font-weight: 700; margin: 6px 0;">Create New Password</h1>
        <p>Use at least 8 characters with uppercase, lowercase, number, and symbol.</p>
      </div>

      <form id="resetPasswordForm" class="form-stack" novalidate>
        <div class="field">
          <label for="newPassword">New Password</label>
          <span class="input-wrap">
            <i data-lucide="lock"></i>
            <input id="newPassword" name="password" type="password" autocomplete="new-password" placeholder="New password" required>
            <button class="icon-button reveal-button" type="button" data-toggle-password="newPassword" aria-label="Show password">
              <i data-lucide="eye"></i>
            </button>
          </span>
        </div>

        <div class="field">
          <label for="confirmNewPassword">Confirm Password</label>
          <span class="input-wrap">
            <i data-lucide="lock"></i>
            <input id="confirmNewPassword" name="confirm_password" type="password" autocomplete="new-password" placeholder="Confirm password" required>
            <button class="icon-button reveal-button" type="button" data-toggle-password="confirmNewPassword" aria-label="Show password">
              <i data-lucide="eye"></i>
            </button>
          </span>
        </div>

        <p id="resetPasswordMessage" class="status-message" role="status" aria-live="polite"></p>

        <button class="primary-button" type="submit">
          <span>Update password</span>
          <i data-lucide="check"></i>
        </button>
        <a class="outline-button" href="index.html">
          <i data-lucide="arrow-left"></i>
          <span>Back to login</span>
        </a>
      </form>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
