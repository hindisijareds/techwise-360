<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechWise 360 | Password Recovery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body data-page="forgot-password">
  <main class="auth-shell compact-auth-shell">
    <section class="form-card login-card recovery-card" aria-labelledby="recovery-title">
      <a class="brand-mark compact-brand" href="index.html">TechWise <span>360</span></a>
      <div class="form-heading">
        <h1 id="recovery-title">Reset Password</h1>
        <p>Enter your account email and we will send a secure reset link.</p>
      </div>
      <form id="forgotPasswordForm" class="form-stack" novalidate>
        <label class="field">
          <span>Email</span>
          <span class="input-wrap">
            <i data-lucide="mail"></i>
            <input name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </span>
        </label>
        <p id="forgotPasswordMessage" class="status-message" role="status" aria-live="polite"></p>
        <button class="primary-button" type="submit">Send reset link</button>
        <a class="outline-button" href="index.html"><span>Back to login</span><i data-lucide="arrow-left"></i></a>
      </form>
    </section>
  </main>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
